<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SurveyGrid</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --accent-green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --error-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 6%;
            background-color: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-light);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--accent-blue);
        }

        /* Login Container */
        .auth-container {
            max-width: 440px;
            width: 90%;
            margin: 3rem auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-light);
        }

        .forgot-link {
            font-size: 0.8rem;
            color: var(--accent-blue);
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        /* Checkbox Row */
        .remember-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .remember-group input[type="checkbox"] {
            accent-color: var(--accent-blue);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Action Button */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* Error Banner */
        .alert-error {
            display: none;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--error-color);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            text-align: center;
        }

        /* Switch Auth Footer */
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Page Footer */
        footer {
            padding: 1.5rem 1rem;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <a href="index.html" class="logo">
            Survey<span>Grid</span>
        </a>
        <a href="register.html" class="nav-link">Don't have an account? Sign Up</a>
    </header>

    <!-- Main Content -->
    <main>
        <div class="auth-container">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your SurveyGrid account</p>
            </div>

            <!-- Error Banner Placeholder -->
            <div id="errorAlert" class="alert-error">
                Invalid email address or password. Please try again.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="form-label-row">
                        <label class="form-label" for="loginPassword">Password</label>
                        <a href="#" class="forgot-link" onclick="handleForgotPassword()">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                </div>

                <!-- Remember Me Checkbox -->
                <div class="remember-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me on this device</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Need an account? <a href="register.html">Create one here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        Need help? Contact <a href="mailto:surveyGrid@gmail.com">surveyGrid@gmail.com</a> | &copy; 2026 SurveyGrid
    </footer>

    <!-- Interactive Script -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            // Simple demo validation
            if (email && password) {
                // Redirect to main workspace dashboard
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorAlert').style.display = 'block';
            }
        }

        function handleForgotPassword() {
            const email = prompt("Please enter your registered email address to receive a password reset link:");
            if (email) {
                alert("If an account exists for " + email + ", a password reset link has been sent.");
            }
        }
    </script>
</body>
</html>
